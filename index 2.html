*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:#0b0b0b;color:#d6d3c4;font-family:'DotGothic16',ui-monospace,monospace;font-size:14px;line-height:1.5}
#app{max-width:420px;margin:0 auto;padding:10px 10px 24px;min-height:100dvh;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;background:#141413;border:1px solid #5F5E5A;padding:9px 6px;border-radius:2px;cursor:pointer;touch-action:manipulation}
button:active{background:#2C2C2A}
button.dim{opacity:.45}
.bx{border:1px solid #444441;padding:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.y{color:#EF9F27}.g{color:#97C459}.r{color:#F09595}.b{color:#85B7EB}.p{color:#AFA9EC}.m{color:#888780}.t{color:#5DCAA5}
.s{font-size:12px}
.bar{height:8px;background:#2C2C2A;position:relative;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#97C459}
canvas{image-rendering:pixelated;display:block}
#map{font-family:ui-monospace,Menlo,monospace;font-size:20px;line-height:23px;white-space:pre;text-align:center;letter-spacing:3px;user-select:none}
.log{min-height:84px;font-size:12px;color:#B4B2A9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal>div{background:#0b0b0b;border:2px solid #5F5E5A;max-width:380px;width:100%;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:85dvh;overflow:auto}
h1{font-size:22px;margin:4px 0;font-weight:400;color:#EF9F27;letter-spacing:4px;text-align:center}
.tag{font-size:11px;padding:0 4px;border:1px solid currentColor}
.card{border:1px solid #444441;padding:6px;text-align:center}
.card.sel{border-color:#EF9F27}
.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#app.fit{height:100vh;height:100dvh;overflow:hidden;padding-bottom:12px;gap:6px}
#vwrap,#swrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.ctrl{display:flex;gap:12px;justify-content:center;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,44px);gap:4px}
.pad button{height:44px;font-size:16px;padding:0}
.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;width:176px}
.side button{height:44px;padding:0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chips button{padding:3px 7px;font-size:12px}
.chips button.on{border-color:#EF9F27;color:#EF9F27}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.g4 button{padding:8px 2px;font-size:13px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.g3 button{padding:8px 4px}
#view,#stage{image-rendering:pixelated}
.topbar{position:sticky;top:0;z-index:5;background:#0b0b0b;display:flex;align-items:center;gap:8px;padding:6px 0 8px;border-bottom:1px solid #2C2C2A;margin:-10px 0 0;padding-top:10px}
.backbtn{padding:7px 10px;white-space:nowrap;font-size:13px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#141413;border:1px solid #EF9F27;padding:8px 14px;z-index:20;max-width:340px;text-align:center;transition:opacity .5s;font-size:13px}
.toast.out{opacity:0}
#app:not(.fit),.modal>div,.toast{zoom:var(--z,1)}
.ctrl.lh{flex-direction:row-reverse}
input[type=range]{accent-color:#EF9F27;height:28px}
#app{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
#app.fit{padding-bottom:max(12px,env(safe-area-inset-bottom))}
.toast{top:max(14px,env(safe-area-inset-top))}
</style>
</head>

function bookPool(cursed){return Object.keys(SK).filter(id=>{const s=SK[id];if(cursed)return s[9];return !s[9]&&s[7]!=='融合'&&s[2]!=='パッシブ'&&!/-013$/.test(id)&&'EDCB'.includes(s[6])})}
function mkBook(c){return{c:c||pick(BOOKCOL),id:rollBook()}}
function rollBook(){const cursed=Math.random()<.22;return pick(bookPool(cursed))}
function bookName(b){if(typeof b!=='object')return '書';return `${isPas(b.id)?'心得の書':'書'}：${SK[b.id][0]}${SK[b.id][9]?' <span class="r">［呪］</span>':''} <span class="s m">${SK[b.id][6]}</span>`}
function readBook(i){i=i||0;const b=G.bag.books.splice(i,1)[0];const id=typeof b==='object'?b.id:rollBook();if(SK[id][9]){stat('curse');tip('curse')}const m=cur();const msg=learn(m,id);modal(`${bookName(b)}を読んだ`,`${SK[id][9]?'<span class="r">呪われた書だった！</span><br>':''}${skHTML(id)}を覚えた。<br><span class="s m">${SK[id][8]||''}</span><br>${msg}`,[[G.bag.books.length?'書の一覧にもどる':'とじる',()=>{if(G.bag.books.length)setTimeout(bookMenu,0)}]])}
function bookMenu(){const bs=G.bag.books.map((b,i)=>[bookName(b),()=>setTimeout(()=>bookAct(i),0)]);bs.push(['とじる',null]);modal('書',`${cur().sp}が読む。<span class="s m">［呪］の書は強いが、使うと狂気がたまる</span>`,bs)}
function bookAct(i){const b=G.bag.books[i];if(b===undefined)return;const bs=[[`${cur().sp}が読む`,()=>setTimeout(()=>readBook(i),0)]];bs.push(['捨てる',()=>{G.bag.books.splice(i,1);setTimeout(bookMenu,0)}]);bs.push(['もどる',()=>setTimeout(bookMenu,0)]);
 const info=typeof b==='object'?`<br><span class="s">${SK[b.id][2]}　威力${SK[b.id][3]||'―'}　気${SK[b.id][5]}</span><br><span class="s m">${SK[b.id][8]||''}</span>${cur().learned.includes(b.id)?'<br><span class="m s">すでに覚えている</span>':''}`:'<br><span class="s m">読むまで中身は分からない（約2割で呪い）</span>';modal(bookName(b),info,bs)}

function bfsPath(tx,ty,goal){const K=(x,y)=>x+','+y,prev={},q=[[R.px,R.py]];prev[K(R.px,R.py)]=null;let end=null;

const RANKS='EDCBAS';
const ELST={火:'火傷',水:'濡れ',風:'乱気',地:'鈍重',雷:'麻痺',氷:'凍結',光:'眩み',闇:'恐怖'};
const PRE={火:'焔',水:'潮',風:'嵐',地:'岩',雷:'雷',氷:'氷',光:'聖',闇:'冥',無:'剛'};
const NOUN={物理:['牙','爪','撃','拳','断','穿'],術:['弾','波','陣','咆','渦','閃'],補助:['の構え','の加護','の印','の舞'],回復:['の癒し','の泉','の息吹'],呪:['の呪','の契り','の業']};
function hstr(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h}
function regMix(){for(const id in(G.mix||{})){SK[id]=G.mix[id].d;EFF[id]=G.mix[id].e}}
function mergeEff(a,b){const e={};const keys=new Set([...Object.keys(a),...Object.keys(b)]);
 for(const k of keys){const x=a[k],y=b[k];
  if(k==='buff'||k==='debuff'||k==='selfDebuff'){const m={};[...(x||[]),...(y||[])].forEach(([s,d,t])=>{if(!m[s]||m[s][0]<d)m[s]=[d,t]});e[k]=Object.entries(m).map(([s,[d,t]])=>[s,d,t])}
  else if(k==='heal'||k==='drain'||k==='mad'||k==='lamp'||k==='hpCost')e[k]=Math.max(x||0,y||0);
  else if(k==='ki'||k==='kiDrain')e[k]=(x||0)+(y||0);
  else if(k==='regen')e[k]=[Math.max((x||[0])[0],(y||[0])[0]),Math.max((x||[0,0])[1],(y||[0,0])[1])];
  else if(k==='hits')e[k]=[Math.max((x||[1,1])[0],(y||[1,1])[0]),Math.max((x||[1,1])[1],(y||[1,1])[1])];
  else if(k==='recoil')e[k]=Math.min(x||99,y||99);
  else e[k]=x!==undefined?x:y}
 return e}
function descEff(e,dmg){const p=[];if(e.st)p.push(`${e.st}を付与${dmg?'（30%）':''}`);(e.buff||[]).forEach(([s,d,t])=>p.push(`${STATN[s]}${d>1?'大':''}↑${t<99?'（'+t+'ターン）':''}`));(e.debuff||[]).forEach(([s,d,t])=>p.push(`敵の${STATN[s]}↓`));if(e.heal)p.push(`HPを${e.heal}%回復`);if(e.drain)p.push(`与ダメの${e.drain}%を吸収`);if(e.hits)p.push(`${e.hits[0]}〜${e.hits[1]}回攻撃`);if(e.crit)p.push('急所に当たりやすい');if(e.prio)p.push('必ず先制');if(e.sure)p.push('必中');if(e.ambush)p.push('敵が行動前なら威力1.5倍');if(e.ki)p.push(`気+${e.ki}`);if(e.kiDrain)p.push(`敵の気-${e.kiDrain}`);if(e.regen)p.push(`毎ターンHP${e.regen[0]}%回復`);if(e.cleanse)p.push('状態異常を解除');if(e.charge)p.push('次の攻撃を強化');if(e.guard)p.push('このターン被ダメ半減');if(e.selfSt)p.push(`自分も${e.selfSt}`);(e.selfDebuff||[]).forEach(([s])=>p.push(`自分の${STATN[s]}↓`));if(e.hpCost)p.push(`HPの${e.hpCost}%を払う`);if(e.mad)p.push('狂気が上がる');if(e.lamp)p.push(`潜行の灯を${e.lamp}消費`);if(e.recoil&&e.recoil<99)p.push(`反動で与ダメの${e.recoil}%`);if(e.rest)p.push('使用後1ターン動けない');return p.join('。')}
function fusePlan(a,b,m){
 const A=SK[a],Bq=SK[b],pa=a.split('-')[0],pb=b.split('-')[0];
 if(pa===pb&&pa!=='NUL'&&pa!=='MX'&&new Set([a.slice(-3),b.slice(-3)]).size===2&&[a.slice(-3),b.slice(-3)].every(x=>x==='003'||x==='006')&&SK[pa+'-014'])return{id:pa+'-014',kind:'秘伝'};
 if(A[1]===Bq[1]&&A[1]!=='無'&&A[3]>0&&Bq[3]>0&&!a.startsWith('MX')&&!b.startsWith('MX')){const nr=RANKS[Math.min(5,Math.max(RANKS.indexOf(A[6]),RANKS.indexOf(Bq[6]))+1)];
  const cand0=Object.keys(SK).filter(id=>{const s=SK[id];return s[1]===A[1]&&s[6]===nr&&s[3]>0&&!s[9]&&s[7]!=='融合'&&!id.startsWith('MX')&&!m.learned.includes(id)}).sort();const sc=cand0.filter(id=>SK[id][2]===A[2]);const cand=sc.length?sc:cand0;
  if(cand.length)return{id:cand[hstr(a+b)%cand.length],kind:'昇華'}}

 const eA=EFF[a]||{},eB=EFF[b]||{};const dA=A[3]>0,dB=Bq[3]>0;const base=dA?A:dB?Bq:A,other=base===A?Bq:A;const el=base[1];
 const cat=dA?A[2]:dB?Bq[2]:(A[2]==='回復'||Bq[2]==='回復'?'回復':A[2]==='呪'||Bq[2]==='呪'?'呪':'補助');
 let pow=0;if(dA||dB){const hi=Math.max(A[3],Bq[3]),lo=Math.min(A[3],Bq[3]);pow=Math.min(175,Math.round((hi*1.2+lo*.45+10)*(G&&fl('forge')>=3?1.05:1)))}
 const acc=Math.min(100,Math.max(A[4],Bq[4]));const ki=Math.max(2,Math.round((A[5]+Bq[5])*.7));
 const rk=RANKS[Math.min(5,Math.max(RANKS.indexOf(A[6]),RANKS.indexOf(Bq[6]))+1)];
 const e=mergeEff(eA,eB);if(other[1]!==el&&other[1]!=='無'&&!e.st&&pow)e.st=ELST[other[1]];
 const ns=NOUN[cat]||NOUN.補助;let name=PRE[el]+(other[1]!==el&&other[1]!=='無'?PRE[other[1]]:'')+ns[hstr(a+b)%ns.length];
 const used=Object.values(SK).map(s=>s[0]);while(used.includes(name))name+='改';
 const d=[name,el,cat,pow,acc,ki,rk,'融合',descEff(e,pow>0)||(pow?'相手にダメージを与える':''),A[9]||Bq[9]?1:0];
 return{id,kind:'合成',d,e}}

function isWeak(ent){const F=FOES[ent.k];if(!cfg().easyWin||F.boss||F.shadow||F.wild||ent.gold||ent.k==='ミミック'||ent.guard)return false;const m=cur();if(!(R.hp>maxHp(m)*.5))return false;const ft=Math.round((R.floor-1)*1.4)+5;return lvSum(effParts(m))>=ft*3}
function quickWin(ent){const m=cur(),F=FOES[ent.k];dex('foe',ent.k);R.ents=R.ents.filter(x=>x!==ent);const n=Math.max(1,Math.round((1+Math.floor(R.floor/2))*chainMul()*shardMul()));G.bag.shards+=n;got('灯片',n);R.got.wins++;stat('wins');stat('easy');
 const w={};PARTS.forEach(k=>w[k]=1);w[F.fav]+=1.5;SP[m.sp].fav.forEach(k=>w[k]+=.5);for(const k in(m.apt||{}))w[k]+=m.apt[k]*.5;let tot=PARTS.reduce((a,k)=>a+w[k],0),r=Math.random()*tot,k=PARTS[0];for(const x of PARTS){r-=w[x];if(r<=0){k=x;break}}
 m.parts[k]++;R.gains[k]++;R.gby=R.gby||{};(R.gby[m.id]=R.gby[m.id]||{})[k]=(R.gby[m.id][k]||0)+1;R.got.eat++;stat('eat');R.hunger=Math.min(100,R.hunger+15);
 R.party.forEach(id=>{const mm=monById(id);if(!mm)return;mm.bw=(mm.bw||0)+1;if(mm.bw>=12&&(mm.bond||1)<5){mm.bw=0;mm.bond=(mm.bond||1)+1;rlog(`<span class="p">${mm.sp}との絆が深まった（絆${mm.bond}）</span>`);stat('bond')}});
 let ig='';if(Math.random()<.2){ig='・'+giveIng(dropIng(ent.k))}sfx('level');rlog(`<span class="g">${ent.k}を一蹴した</span>（灯片+${n}・${PN[k]}Lv${m.parts[k]}${ig}）`);tip('easy')}
function shardMul(){return 1+(hasR('suzu')?.5:0)+mfx('shard')}
function dropIng(k){const F=FOES[k]||{};const pool=ingPool();if(['ツララガイ','ツルハシガニ','イシムシ'].includes(k)&&Math.random()<.5)return 'kou';if(['コケネズミ','スミモグラ','コオリトカゲ'].includes(k)&&Math.random()<.5)return 'niku';return pick(pool)}
function hungerInt(){return Math.max(2,Math.round((band().hunger||5)/(1-Math.min(.7,mfx('hunger')))))}

Object.assign(TIPS,{relic:['灯具','潜行中だけ効く宝物「灯具」を手に入れた。いくつでも重ねて持てる（持ち物で確認）。<br>帰還したときに1つだけ選んで、次の潜行へ持ち越せる。全滅すると持ち越せない。'],
 gold:['金色の魔物','金色に光る魔物がいる！すぐに逃げてしまうが、倒せば灯片が大量に手に入り、捕食で部位が一気に上がる。<br>行き止まりや部屋の隅に追い込もう。'],
 easy:['格下','自分よりずっと弱い魔物は、戦わずに一蹴できる（設定で切り替え）。'],
 cook:['かまど','魔物や宝箱から手に入る食材で料理を作れるようになった。<br>料理は持ち物になり、潜行中に好きなときに食べると数階のあいだ効果が続く。'],
 chestT:['宝箱のランク','宝箱には木・銀・金・灯の4段階がある。光っている宝箱ほど中身が豪華。灯の宝箱には必ず「灯具」が入っている。']});

/* ---------- boot ---------- */
function bootFix(){migrate();if(G.bag.shards==null)G.bag.shards=0;if(!G.bag.val)G.bag.val={};if(G.mons&&G.mons.length&&!G.party)G.party=[(G.mons[G.active]||G.mons[0]).id];if(G.bag.hiherb){G.bag.herb2=(G.bag.herb2||0)+G.bag.hiherb;delete G.bag.hiherb}if(G.bank==null)G.bank=0;if(!G.mix)G.mix={};if(!G.fac)G.fac={};if(!G.st)G.st={};if(!G.ach)G.ach={};regMix();G.mons.forEach(m=>{if(m.alt)altSpr(SP[m.sp].spr)});applyCfg();if(G.screen!=='title'&&G.screen!=='pick'&&G.screen!=='camp'&&G.screen!=='mon')G.screen=G.mons.length?'camp':'title'}
function resumeRun(rr){R=rr;if(!R.hps){const id=(G.mons[G.active]||G.mons[0]).id;R.hps={[id]:R.hp||maxHp(monById(id))};R.lead=id;R.party=[id]}if(!R.gby)R.gby={};delete R.hp;bindHP();useTheme(R.theme||0);R.dx=R.px;R.dy=R.py;R.ents.forEach(e=>{e.dx=e.x;e.dy=e.y});computeVis();G.screen='map';render();modal('潜行を再開',`B${R.floor}の探索の途中から再開した。<br><span class="s m">戦闘中に中断した場合は、その直前から始まる。</span>`,[['つづける',null]])}
G=load()||newG();bootFix();
{const rr=loadRun();if(rr&&G.mons.length&&rr.ents){resumeRun(rr)}else render()}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
