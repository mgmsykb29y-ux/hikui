*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:#0b0b0b;color:#d6d3c4;font-family:'DotGothic16',ui-monospace,monospace;font-size:14px;line-height:1.5}
#app{max-width:420px;margin:0 auto;padding:10px 10px 24px;min-height:100dvh;display:flex;flex-direction:column;gap:8px}
button{font:inherit;color:inherit;background:#141413;border:1px solid #5F5E5A;padding:9px 6px;border-radius:2px;cursor:pointer;touch-action:manipulation}
button:active{background:#2C2C2A}
button.dim{opacity:.45}
.bx{border:1px solid #444441;padding:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.y{color:#EF9F27}.g{color:#97C459}.r{color:#F09595}.b{color:#85B7EB}.p{color:#AFA9EC}.m{color:#888780}.t{color:#5DCAA5}
.s{font-size:12px}
.bar{height:8px;background:#2C2C2A;position:relative;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#97C459}
canvas{image-rendering:pixelated;display:block}
#map{font-family:ui-monospace,Menlo,monospace;font-size:20px;line-height:23px;white-space:pre;text-align:center;letter-spacing:3px;user-select:none}
.log{min-height:84px;font-size:12px;color:#B4B2A9}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal>div{background:#0b0b0b;border:2px solid #5F5E5A;max-width:380px;width:100%;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:85dvh;overflow:auto}
h1{font-size:22px;margin:4px 0;font-weight:400;color:#EF9F27;letter-spacing:4px;text-align:center}
.tag{font-size:11px;padding:0 4px;border:1px solid currentColor}
.card{border:1px solid #444441;padding:6px;text-align:center}
.card.sel{border-color:#EF9F27}
.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#app.fit{height:100vh;height:100dvh;overflow:hidden;padding-bottom:12px;gap:6px}
#vwrap,#swrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.ctrl{display:flex;gap:12px;justify-content:center;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,44px);gap:4px}
.pad button{height:44px;font-size:16px;padding:0}
.side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;width:176px}
.side button{height:44px;padding:0;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chips button{padding:3px 7px;font-size:12px}
.chips button.on{border-color:#EF9F27;color:#EF9F27}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.g4 button{padding:8px 2px;font-size:13px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.g3 button{padding:8px 4px}
#view,#stage{image-rendering:pixelated}
.topbar{position:sticky;top:0;z-index:5;background:#0b0b0b;display:flex;align-items:center;gap:8px;padding:6px 0 8px;border-bottom:1px solid #2C2C2A;margin:-10px 0 0;padding-top:10px}
.backbtn{padding:7px 10px;white-space:nowrap;font-size:13px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#141413;border:1px solid #EF9F27;padding:8px 14px;z-index:20;max-width:340px;text-align:center;transition:opacity .5s;font-size:13px}
.toast.out{opacity:0}
#app:not(.fit),.modal>div,.toast{zoom:var(--z,1)}
.ctrl.lh{flex-direction:row-reverse}
input[type=range]{accent-color:#EF9F27;height:28px}

.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0}.cell{position:relative;aspect-ratio:1;background:#242422;border:2px solid #444441;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer}.cell img{width:72%;image-rendering:pixelated}.cell .cnt{position:absolute;right:3px;bottom:0;font-size:13px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}.cell .nw{position:absolute;left:3px;top:0;font-size:10px;color:#F09595}.cell .lab{position:absolute;left:3px;bottom:0;font-size:10px;color:#FAC775}.cell.empty{border-style:dashed;opacity:.45;cursor:default}.cell.r2{border-color:#378ADD}.cell.r3{border-color:#7F77DD}.sumc{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:4px 0}.sumc>div{background:#242422;border:1px solid #444441;border-radius:4px;text-align:center;padding:3px 0}
@keyframes jfx{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}#app{padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
#app.fit{padding-bottom:max(12px,env(safe-area-inset-bottom))}
.toast{top:max(14px,env(safe-area-inset-top))}
</style>
</head>

function mkMon(sp){const m={id:G.uid++,sp,parts:{head:1,arm:1,body:1,leg:1,core:1},learned:[...SP[sp].sk],equip:[...SP[sp].sk],bond:1,bw:0,base:{},apt:{},pass:[],omen:0,bunto:0,gen:1,nat:rnd(NAT.length)};return m}
function monById(id){return G.mons.find(m=>m.id===id)}
function cur(){if(R&&R.lead!=null){const m=monById(R.lead);if(m)return m}return G.mons[G.active]}
function maxHp(m){return mstats(m).hp}
function pSlots(){return 1+(G.cleared[5]?1:0)+(G.cleared[10]?1:0)}
function partyIds(){if(!G.mons.length)return[];const busy=new Set((G.exp||[]).map(x=>x.id).concat((G.past||{}).ids||[]));if(!G.party||!G.party.length)G.party=[(G.mons[G.active]||G.mons[0]).id];G.party=G.party.filter(id=>monById(id)&&!busy.has(id)).slice(0,pSlots());if(!G.party.length){const f=G.mons.find(m=>!busy.has(m.id))||G.mons[0];G.party=[f.id]}return G.party}
function bindHP(){Object.defineProperty(R,'hp',{get(){return R.hps[R.lead]},set(v){R.hps[R.lead]=v},configurable:true,enumerable:false})}
function healAll(){R.party.forEach(id=>{const m=monById(id);if(m)R.hps[id]=maxHp(m)})}
function aliveIds(){return R.party.filter(id=>R.hps[id]>0)}
function setLead(id){if(!R||!(R.hps[id]>0))return;R.lead=id;sfx('click');refreshMap()}

function lvSum(p){return PARTS.reduce((a,k)=>a+p[k],0)}
function rank(p){const t=lvSum(p);return t<=25?'E':t<=60?'D':t<=110?'C':t<=160?'B':t<=210?'A':'S'}

function topBar(){if(!['tree','quest','mpick','mon','fuse','party','fac','dex','ach','breed','cfg','cook'].includes(G.screen))return;const bs=[...app.querySelectorAll('button')].filter(b=>b.textContent.trim()==='もどる');const back=bs[bs.length-1];if(!back)return;back.remove();const hd=app.firstElementChild;const bar=document.createElement('div');bar.className='topbar';const bb=btn('◀ もどる',()=>back.onclick());bb.className='backbtn';bar.appendChild(bb);app.insertBefore(bar,hd);if(hd){hd.style.flex='1';hd.style.minWidth='0';bar.appendChild(hd)}if(UI.lastScr!==G.screen)window.scrollTo(0,0);UI.lastScr=G.screen}
function el(h){const d=document.createElement('div');d.innerHTML=h;return d}
function btn(label,fn,cls){const fn0=fn;fn=function(){sfx('click');return fn0.apply(this,arguments)};const b=document.createElement('button');b.innerHTML=label;if(cls)b.className=cls;b.onclick=fn;return b}
function modal(title,body,buttons,after){UI.modal={title,body,buttons,after};rModal()}
function closeModal(){UI.modal=null;const m=$('.modal');if(m)m.remove()}
function rModal(){const old=$('.modal');if(old)old.remove();if(!UI.modal)return;const m=UI.modal,w=document.createElement('div');w.className='modal';const d=document.createElement('div');d.appendChild(el(`<div class="y">${m.title}</div><div>${m.body}</div>`));const bs=document.createElement('div');bs.style.cssText='display:flex;flex-direction:column;gap:5px';m.buttons.forEach(([l,f])=>bs.appendChild(btn(l,()=>{UI.modal=null;f&&f();render()})));d.appendChild(bs);w.appendChild(d);document.body.appendChild(w);if(m.after)try{m.after(w)}catch(e){console.error(e)}}

['v10','2026-11',`<span class="y">B51〜B100を追加（灯の源まで）</span><br>・新しい地帯5つ：沈んだ書庫／鉄の峡谷／白夜の庭／天穹の回廊／灯の源。BGMも5曲<br>・新しい魔物21種、主10体（それぞれ独自の仕掛け）、真のエンディング<br>・野生の新種10種：B51以降で灯籠・囚われの灯から仲間に<br>・主の幼体5種：ワタコ・コダイダ・ハクヤコ・テンコ・ヒノコ<br>・深い主の灯の核は、はじめから素質値を持った新種が生まれる<br><span class="y">配合</span><br>・極種8種（同じ属性の上位種どうし）、混成種+12、秘配合+4。全72種に<br><span class="y">技</span><br>・新しい技40・心得10。秘伝は各属性3つに<br>・連携技30種：違う属性の技を融合の炉で合わせる<br>・B51以降の書はまれにA格<br><span class="y">調整</span><br>・主を強化（特にB5〜B35）。部位Lvを上げて挑めば勝てる強さ<br>・主で全滅すると攻略の手がかり、雑魚で全滅すると一言の助言<br>・B80・B85の前は清めの葉が安く買える<br>・ごちそうキノコ（B81〜90）：捕食で部位がもう1つ上がる<br>・ハジキを少し打たれ強く<br><span class="y">画面</span><br>・野営地のボタンを「育成／お店／記録」にまとめた<br>・配合表は開いて見る形に<br>・更新情報をいつでも読めるように（記録→更新情報）`],
['v9','2026-11',`・灯片の入手が2倍に<br>・潜行中に設定を開けるように<br>・速さで追撃が出るように。初期8種に特性<br>・融合と配合の強さを調整、秘配合4種、配合のうわさ<br>・灯具の3択（3階ごと）、連灯の節目の宝箱、次の階の予告、踏破の褒美、宝の地図、帰還のくじ<br>・主の手前の休み場（見立て・回復・練習の階）<br>・行商人の希少品枠`],

const HELP=[
['基本',`<span class="y">灯喰いとは</span><br>地の底の大穴に潜り、魔物を倒して「捕食」し、仲間の部位を育てていく遊び。<br><span class="y">流れ</span><br>野営地で準備 → 潜行（カバンに道具を入れて出発）→ 階段を降りて深く → 帰還して育成、をくり返す。<br><span class="y">部位</span><br>頭・腕・胴・脚・核の5つ。部位Lvの合計が強さの目安。捕食で1つ上がる。<br><span class="y">格</span><br>部位Lvの合計で E〜S の格が決まる。格が上がると技や心得の枠が増える。<br><span class="y">残り灯と灯の大樹</span><br>潜るたびに残り灯を持ち帰る（全滅しても必ず）。灯の大樹で使うと、ずっと続く強化が得られる。<br><span class="y">誓い</span><br>誓いの石碑を建てると、潜る前のカバン画面で縛りを誓える。誓うほど報酬が増える。<br><span class="y">目標</span><br>野営地の「今の目標」に、次に解く封印（章）と受けている依頼が出る。<br><span class="y">灯の祠</span><br>主を倒すと現れる。触れると、次からその祠の階（主はいない）から潜れる。<br>はじめて触れた祠は、3つから1つ「祝福」をくれる（その先5階のあいだ効く）。2回目からは、潜る前のカバン画面で灯片を払うと弱めの「加護」を受けて潜れる。<br><span class="y">住人</span><br>野営地の風景の下に並ぶ住人をタップすると話せる。「！」はお使いの合図。頼まれた素材を届けると、灯片と、住人ごとのずっと続く恩恵がもらえる。<br><span class="y">性格</span><br>仲間には性格があり、能力の1つが+10%、別の1つが-10%になる。灯合わせでは親のどちらかの性格を受け継ぐ。希少品「心の鏡」で変えられる。<br><span class="y">月の満ち欠け</span><br>実際の日付の月齢が野営地に出る。満月の夜は金色の魔物が多く、新月の夜は闇が深いぶん灯片が増える。<br><span class="y">図鑑</span><br>種族をタップすると、手に入れ方の手がかりが見られる。<br><span class="y">灯の両替</span><br>灯の大樹の画面で、灯片300→残り灯1、残り灯1→灯片100に両替できる（1日それぞれ30まで）。<br><span class="y">灯の残り香</span><br>捕食率60%以下の格下を倒すと40%で落とす。個体画面で使うと、1個につき部位がランダムに+1。<br><span class="y">蘇りの灯</span><br>倒れた仲間を起こす（蘇りの灯＝HP50%、蘇りの大灯＝全快）。戦闘中・探索中に使える。道具屋・調合台・宝箱から。<br><span class="y">放牧地</span>（育成→放牧地、B10から）<br>同行しない仲間を放すと、30分ごとに素材・灯片・残り香を集める（最大8時間ぶん）。<br><span class="y">地底湖</span>（育成→地底湖で釣り、B5から）<br>1日8回。「！」ですぐタップ、針が光る帯に入ったらタップ。満月は珍しい魚が寄る。<br><span class="y">迷い子</span><br>B11以降でときどき泣いている。階段まで連れていくと野営地の住人になる（5人・それぞれ恩恵あり）。戦闘になるたびに怖がり、3回で逃げてしまう。<br><span class="y">主の記憶</span><br>主を倒すと、その主のかつての姿の話が読める（記録→物語→主の記憶）。<br><span class="y">色違いの野生</span><br>まれに光る野生の魔物が出る。倒すと必ず亜種として仲間になる。図鑑に✦。<br><span class="y">深淵の階段</span><br>まれに出る暗い階段。灯15で2階下へ。着いた階は灯片2倍・宝箱が1段階良い。<br><span class="y">黄金の間</span><br>まれに迷いこむ敵のいない階。60歩のうちに宝箱を集める。歩き切るか階段で、灯を使わず次の階へ。<br><span class="y">素質の種・忘れ草</span><br>素質の種＝部位の素質+1（希少）。忘れ草＝技を1つ忘れて灯片に（道具屋・床で拾える）。どちらも個体画面で使う。<br><span class="y">魔物の夢</span><br>3時間以上あけて開くと、仲間が見た夢の話が読める。まれに絆・素材・技・性格の変化を持ち帰る。<br><span class="y">依頼ボード</span><br>3つまで受けられる。達成したら野営地で報酬を受け取る。<br><span class="y">進化</span><br>格Cになると次の姿に進化できる。最終進化には格Aと系統ごとの条件が要る。個体画面の「進化」欄で確認できる。<br><span class="y">技の詳細</span><br>技の名前を長押しすると、威力・命中・効果が見られる。`],
['探索',`<span class="y">移動</span><br>十字キーか画面のタップで動く。長押しで歩き続ける。「自動探索」で未踏の場所へ進む。<br><span class="y">階段</span><br>下り階段で次の階へ。降りるたびに灯を使う（深いほど多い）。5階ごとに主がいる。<br><span class="y">調べる</span><br>周りの罠と床下の宝を見つけ、残りの魔物・強い気配の方角・宝箱の数が分かる。<br><span class="y">罠</span><br>部屋の中にある。隣に来ると気づくことがあり、外す・飛び越える・（落とし穴なら）飛び降りるを選べる。<br><span class="y">階の様子</span><br>穏やか／ふつう／荒れ（敵が強いが灯片が多い）。異変が起きている階もある。<br><span class="y">影喰い</span><br>同じ階に長居すると現れる強い魔物。<br><span class="y">野の技</span><br>同行の仲間が決まった技を覚えていると、マップで使える（灯3）。地＝岩砕き（地割り）でひびの壁、風＝風読み（追い風）で床下の宝、雷＝雷動（帯電）で鍵の扉、光＝照らし（照らし出す）、闇＝影渡り（影潜り）、水＝波乗り（流水の構え）で地下水路、火＝焼き払い（フレア）で茨、氷＝凍らせ（凍て付き）で毒の沼。水路・茨・毒の沼はその属性の地帯に出る。<br><span class="y">記録</span><br>画面下の記録をタップすると、これまでの記録が見られる。`],
['戦闘',`<span class="y">技</span><br>力で戦う「物理」と、術で戦う「術」がある。気を使う。<br><span class="y">相性</span><br>▲は相手に効きやすい、▼は効きにくい。自分と同じ属性の技は威力+15%。<br><span class="y">交代</span><br>同行している仲間と入れ替えられる（1ターン使う）。先頭が倒れたら次の仲間を出す。全員倒れると全滅。<br><span class="y">状態異常</span><br>火傷・濡れ・乱気・鈍重・麻痺・凍結・眩み・恐怖。清めの葉などで治る。<br><span class="y">狂気</span><br>呪いの技などでたまり、80%を超えると暴走する。気付け薬で戻る。<br><span class="y">背後</span><br>気づかれる前に敵にぶつかると、最初のターンは必ず先に動ける。`],
['育成',`<span class="y">捕食と封印</span><br>勝った後、捕食で部位Lv+1、封印でその魔物の技を覚える。格下を捕食すると上がりにくい。<br><span class="y">同行の成長</span><br>とどめを刺した仲間がいちばん育ち、ほかの同行も少し育つ。<br><span class="y">ひらめき</span><br>戦いの中でまれに新しい技を思いつく。<br><span class="y">書</span><br>読むと技や心得を覚える。［呪］の書は強いが狂気がたまる（浄化もできる）。<br><span class="y">絆</span><br>一緒に勝つほど深まり、能力が少し上がる。<br><span class="y">お気に入り</span><br>★を付けた仲間は灯合わせや灯に還すに使えない。`],
['配合・融合',`<span class="y">灯合わせ（配合）</span><br>2体を合わせて新しい種族を生む。同じ属性なら上位種、特定の組み合わせなら混成種・極種・秘配合種。親の素質値を少し受け継ぐ。<br><span class="y">分灯</span><br>絆3以上の仲間から子を生む。まれに色違いの亜種。<br><span class="y">融合の炉</span><br>技2つから新しい技を作る。同じ属性の特定の2つで秘伝、違う属性の特定の2つで連携技。<br><span class="y">灯の核</span><br>主を倒すと手に入り、野営地で目覚めさせると仲間になる。`],
['道具・料理',`<span class="y">カバンと道具箱</span><br>潜行に持っていけるのはカバンの中身だけ（6マス・1マス10個、灯片で広がる）。帰ってもカバンの中身は残る。<br><span class="y">調合台</span><br>道具・食材・換金品を組み合わせて新しい道具を作る。深い階ほど作れるものが増える。<br><span class="y">かまど</span><br>食材から料理を作る。食べると数階のあいだ効果が続く。<br><span class="y">換金所</span><br>換金品や書を灯片に換える。<br><span class="y">灯具</span><br>潜行中に手に入る持ち物。帰還時に1つ次へ持ち越せる。`],
['灯・腹・闇',`<span class="y">灯</span><br>階段で使い、B11以降は歩いても少しずつ減る。15以下で敵が強くなる。<br><span class="y">灯が尽きたら</span><br>「闇潜り」で進むか、灯片の15%を落として戻るかを選ぶ。闇の中は灯片1.5倍だが危険。<br><span class="y">腹</span><br>歩くと減り、捕食や食料で回復。50以下で歩いても回復せず、20以下で弱くなる。<br><span class="y">帰還</span><br>いつでも野営地へ戻れる。育った部位は持ち帰れる。<br><span class="y">全滅</span><br>その潜行で上がった部位Lvと灯片の半分を失う（道具は失わない）。`],

const TREE=[['hp','根','仲間の最大HP',5,l=>`+${4*l}%`],['bag','幹','カバンのマス',3,l=>`+${l}`],['lamp','枝','潜行開始時の灯と上限',5,l=>`+${8*l}`],['hira','葉','ひらめきの起こりやすさ',3,l=>`+${15*l}%`],['eat','花','捕食で部位が上がる確率',5,l=>`+${4*l}%`],['shard','実','灯片の入手',5,l=>`+${6*l}%`],['guard','種','全滅・灯切れで失うもの',3,l=>`-${8*l}%`],['ember','灯','残り灯の入手',3,l=>`+${10*l}%`]];
const TCOST=[6,12,20,30,44];
function tr(k){return (G.tree||{})[k]||0}
function slotCap(){return (G.slots||6)+tr('bag')+resBag()}
function lampStart(){return 100+3*resLv('vow')+(G.lampBonus||0)+8*tr('lamp')-((G.vowSel||{}).lamp&&fl('vow')?40:0)}
function treeCanAny(){return TREE.some(([k,,,mx])=>{const l=tr(k);return l<Math.min(mx,fl('tree'))&&(G.ember||0)>=TCOST[l]})}
function rTree(){const E=G.ember||0,cap=fl('tree');
 app.appendChild(el(`<div class="row"><span class="y">灯の大樹</span><span class="s">残り灯 <span class="t">${E}</span></span></div><div class="s m">潜るたびに持ち帰る「残り灯」で、大樹の枝を育てる。効果はずっと続く。<br>大樹の強さ（野営地の発展）Lv${cap}：各枝はLv${cap}まで育てられる。</div>`));app.appendChild(exBox());
 TREE.forEach(([k,n,d,mx,f])=>{const l=tr(k),lim=Math.min(mx,cap),c=TCOST[l];const bx=el('');bx.className='bx s';bx.innerHTML=`<div class="row"><span class="y">${n}<span class="m">（${d}）</span></span><span>${'●'.repeat(l)}<span class="m">${'○'.repeat(mx-l)}</span></span></div><div>${l?'いま '+f(l):'<span class="m">まだ育てていない</span>'}${l<mx?`　<span class="m">次 ${f(l+1)}</span>`:''}</div>`;

const MAPS={};function mapSpr(key,flip){if(!IMGK(key))return sprC(key,flip);const kk=key+(flip?'f':'');if(MAPS[kk])return MAPS[kk];const src=drawImgSpr(key,1,!flip);const t=/^i_b\d/.test(key)?14:16,k=Math.min(1,t/Math.max(src.width,src.height));const c=mkC(Math.max(1,Math.round(src.width*k)),Math.max(1,Math.round(src.height*k))),x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);return MAPS[kk]=c}

Object.assign(CORE_B,{ミズフミ:7,ツチノコ:9,カゼキツネ:13});

G=load()||newG();bootFix();migrateSp();
const PASSH=hstr(normPass('ンコシ'));
function normPass(v){return String(v||'').trim().normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,'')}
function gateOK(){try{return localStorage.getItem('hikui-gate')===String(PASSH)}catch(e){return true}}
function showGate(go){app.innerHTML='';app.className='';app.appendChild(el(`<div style="height:18vh"></div><h1>灯 喰 い</h1><div class="m s" style="text-align:center;margin-bottom:14px">合言葉を入れてください</div>`));
 const inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.setAttribute('autocapitalize','off');inp.style.cssText='width:100%;padding:10px;font:inherit;font-size:16px;background:#141413;color:#F1EFE8;border:1px solid #5F5E5A;border-radius:0;user-select:text;-webkit-user-select:text';app.appendChild(inp);
 const msg=el('<div class="s r" style="text-align:center;min-height:20px;margin-top:6px"></div>');
 const ok=()=>{if(hstr(normPass(inp.value))===PASSH){try{localStorage.setItem('hikui-gate',String(PASSH))}catch(e){}go()}else{msg.textContent='合言葉がちがうようだ…';inp.value=''}};
 const b=btn('灯をともす',ok);b.style.marginTop='10px';app.appendChild(b);app.appendChild(msg);inp.onkeydown=e=>{if(e.key==='Enter')ok()};}
IMGP.then(()=>{const go=()=>{const rr=loadRun();if(rr&&G.mons.length&&rr.ents){resumeRun(rr)}else render()};if(gateOK())go();else showGate(go)})
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
